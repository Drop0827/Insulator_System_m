# YOLO11 + P-C3k2（部分卷积）改进模型配置
# 改进策略：在 Neck 的高语义特征层用 C3k2_PConv 替换标准 C3k2
# 参考论文：《基于改进 YOLOv11 的钢轨缺陷检测实验研究》2025
# 核心收益：在几乎不损失精度的前提下，显著降低 FLOPs、提升 FPS

# Parameters
nc: 2  # 类别数：insulator, broken
scale: n
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11n backbone（与基线完全一致，保证预训练权重 100% 复用）
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]           # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]          # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2
  - [-1, 1, Conv, [256, 3, 2]]          # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]   # 4
  - [-1, 1, Conv, [512, 3, 2]]          # 5-P4/16
  - [-1, 2, C3k2, [512, True]]          # 6
  - [-1, 1, Conv, [1024, 3, 2]]         # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]         # 8
  - [-1, 1, SPPF, [1024, 5]]            # 9
  - [-1, 2, C2PSA, [1024]]              # 10

# YOLO11n head
# NOTE: 用 C3k2_PConv 替换 Neck 中的 C3k2，Backbone 保持原样以复用预训练权重
# 替换位置在 P4/P5 融合层（高语义区域），对速度和精度权衡最优
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]                   # cat backbone P4
  - [-1, 2, C3k2, [512, False]]                 # 13（P4上采样融合，保留原始利于精度）

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]                   # cat backbone P3
  - [-1, 2, C3k2, [256, False]]                 # 16-P3/8-small（小目标检测层不改）

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]                  # cat head P4
  - [-1, 2, C3k2_PConv, [512, False]]           # 19-P4/16-medium ← PConv 改进

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]                  # cat head P5
  - [-1, 2, C3k2_PConv, [1024, True]]           # 22-P5/32-large  ← PConv 改进

  - [[16, 19, 22], 1, Detect, [nc]]             # Detect(P3, P4, P5)
